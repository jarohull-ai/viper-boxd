schema = "viper-boxd.model-gateway.v0"
gateway_id = "OPENROUTER_V1"
provider = "openrouter"
endpoint = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"
api_key_env = "OPENROUTER_API_KEY"
max_requests = 30
max_prompt_chars = 8000
max_output_tokens = 256
timeout_seconds = 30

# EMBED is opt-in, same pattern as [stream]. Uses the same api_key_env as
# MODEL_GENERATE above. OpenRouter's /embeddings endpoint mirrors OpenAI's
# shape exactly (confirmed against their published OpenAPI spec).
[embed]
model = "openai/text-embedding-3-small"
max_input_chars = 8000

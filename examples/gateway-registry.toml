# Administrator-owned mapping from a stable gateway reference to the local
# Unix socket of a running gateway process. viper-helper resolves
# `gateway_refs` against this file; it never accepts a raw socket path from a
# spawn request. See BACKEND_DECISION.md ("gateway references, not
# sockets/URLs") and GATEWAY_CONTRACT.md.
schema = "viper-boxd.gateway-registry.v0"

[gateways]
RESEARCH_PUBLIC_WEB_V1 = "/tmp/viper-research-gateway.sock"
MOCK_RESEARCH_V0 = "/tmp/viper-gateway-mock.sock"
VIPER_LOCAL_OLLAMA_V1 = "/tmp/viper-model-gateway.sock"
OPENAI_GPT_V1 = "/tmp/viper-model-gateway-openai.sock"
ANTHROPIC_CLAUDE_V1 = "/tmp/viper-model-gateway-anthropic.sock"
OPENROUTER_V1 = "/tmp/viper-model-gateway-openrouter.sock"

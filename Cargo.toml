[package]
name = "viper-boxd"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Unprivileged simulator for the viper-boxd trusted runner"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/jarohull-ai/viper-boxd"
readme = "README.md"

[dependencies]
jfp-box = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "json"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
